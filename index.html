boys = boys.split("\n").map((x)=>[x.split("~"),"M"].flat())
girls = girls.split("\n").map((x)=>[x.split("~"),"F"].flat())
names = [boys,girls].flat()
names.sort((a,b)=>b[1]-a[1])

function search(x) {
    x = x.toLocaleLowerCase()
    let leftdot = x[0] == "."
    let rightdot = x[x.length-1] == "."
    let mnames = names
    if (x[x.length-1] == ".") x = x.substr(0,x.length-1)
    if (x[0] == ".") x = x.substr(1,x.length-1)
    if (rightdot || (!leftdot && !rightdot)) {
        for (let i = 0; i < x.length; i++) {
            let znames = []
            for (let j = 0; j < mnames.length; j++) {
                let q = mnames[j][0][i]
                if (q == undefined) continue
                if (q.toLocaleLowerCase() == x[i] || q.toLocaleUpperCase() == x[i]) {
                    znames.push(mnames[j])
                }
            }
            mnames = znames
        }
        return mnames
    }
    if (leftdot) {
        for (let i = 0; i < x.length; i++) {
            let znames = []
            for (let j = 0; j < mnames.length; j++) {
                let q = mnames[j][0][mnames[j][0].length-1-i]
                if (q == undefined) continue
                if (q.toLocaleLowerCase() == x[x.length-1-i] || q.toLocaleUpperCase() == x[x.length-1-i]) {
                    znames.push(mnames[j])
                }
            }
            mnames = znames
        }
        return mnames
    }
    if (leftdot && rightdot) {
        let znames = []
        for (let j = 0; j < mnames.length; j++) {
            if (mnames[j][0].includes(x)) {
                znames.push(mames[j])
            }
        }
        return znames
    }
}
function htmlIze(x) {
    if (x.length == 0) return `No names.`
    let totalk = 0; let totalb = 0; let totalg = 0
    let totalkp = 0; let totalbp = 0; let totalgp = 0
    x.map((u)=>{
        totalk++; totalkp += Number(u[1])
        if (u[2] == "M") {
            totalb++; totalbp += Number(u[1])
        } else {
            totalg++; totalgp += Number(u[1])
        }
    })
    let totalN = `${totalb.toLocaleString().fontcolor("#88f")}:${totalk}:${totalg.toLocaleString().fontcolor("#f88")}`
    let totalP = `${totalbp.toLocaleString().fontcolor("#88f")}:${totalkp}:${totalgp.toLocaleString().fontcolor("#f88")}`
    let total = `${totalN} <Names People> ${totalP}`
    return total + "\n" + x.map((u)=>`${u[0]}: ${Number(u[1]).toLocaleString()}`.fontcolor(u[2]=="M"?"#88f":"#f88")).join("\n")
}
total = 0
names.map((u)=>total+=Number(u[1]))
function random() {
    let q = Math.random()*total
    let total2 = 0
    let i = -1
    while (q > total2) {
        i++
        total2 += Number(names[i][1])
    }
    return names[i][0]
}
